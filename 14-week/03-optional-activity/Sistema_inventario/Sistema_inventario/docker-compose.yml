version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: postgres_enterprise

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - enterprise_network

  mongo:
    image: mongo:7
    container_name: mongo_enterprise

    restart: always

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    ports:
      - "${MONGO_PORT}:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - enterprise_network

  mongo-express:
    image: mongo-express
    container_name: mongo_express

    restart: always

    depends_on:
      - mongo

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo

    ports:
      - "${MONGO_EXPRESS_PORT}:8081"

    networks:
      - enterprise_network

volumes:
  postgres_data:
  mongo_data:

networks:
  enterprise_network:
    driver: bridge